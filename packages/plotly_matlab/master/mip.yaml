name: plotly_matlab
description: "plotly_matlab: create interactive Plotly graphs from MATLAB figures (fig2plotly, plotlyfig)."
version:
license: "MIT"
homepage: "https://plotly.com/matlab/"
repository: "https://github.com/plotly/plotly_matlab"
dependencies: []

# Mirrors plotlysetup_offline.m, which adds genpath(<root>/plotly). All
# toolbox functions (fig2plotly, plotlyfig, ...) live under plotly/.
paths:
  - path: plotly
    recursive: true

builds:
  - architectures: [any]
    test_script: test_plotly_channel.m
